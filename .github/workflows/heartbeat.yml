name: Heartbeat (FrenzyPenguin Media)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

# Runs every 6 hours and pushes to a shared automation branch. Two overlapping
# runs would force-push over each other's heartbeat and race to open a PR, so
# serialise them.
concurrency:
  group: heartbeat
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync FB feed (FrenzyPenguin Media)
        run: |
          mkdir -p data/feeds
          curl -sf "https://www.facebook.com/frenzypenguin.media" -o data/feeds/fpm-fb.html 2>/dev/null || echo "FB sync failed (offline)" > data/feeds/fpm-fb.html
          echo "Last sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/feeds/fpm-fb.last

      - name: Generate FPM heartbeats
        run: node scripts/heartbeat/generate.mjs

      # Both generators write tracked files, so stage everything once and open a
      # single PR. The default branch is protected, so a bare `git push` can no
      # longer land either the feed snapshot or the heartbeat.
      - name: Open or update heartbeat pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/heartbeat
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "N3Vr0Tr4nsm1tt3r / CNS"
          git config user.email "cns@neohiro.io"
          git add data/feeds heartbeats/
          if git diff --staged --quiet; then
            echo "No heartbeat changes; nothing to do."
            exit 0
          fi

          git commit -m "chore: FPM heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"

          # Plain --force: checkout is depth-1, so there is no remote-tracking ref
          # for $BRANCH and --force-with-lease would fail with stale info. Safe
          # because the branch is bot-owned and carries no other work.
          git push --force origin "HEAD:refs/heads/$BRANCH"

          number=$(gh pr list --head "$BRANCH" --state open --json number \
            --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            echo "Updated existing PR #${number}"
            gh pr comment "$number" --body "Heartbeat refreshed by run ${GITHUB_RUN_ID}."
          else
            gh pr create \
              --head "$BRANCH" \
              --base "$BASE" \
              --title "chore: FPM heartbeat" \
              --body "Automated refresh of `data/feeds/` and `heartbeats/` from `.github/workflows/heartbeat.yml`."
          fi