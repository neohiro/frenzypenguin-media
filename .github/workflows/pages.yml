name: Build & Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Verify heartbeat generator
        # generate.mjs only runs on the 6-hourly heartbeat schedule. If it throws,
        # the step fails but nothing on the site breaks, so the breakage stays
        # invisible until someone notices a stale SVG. Run it here so a syntax
        # error or malformed output fails the PR.
        run: |
          node --check scripts/heartbeat/generate.mjs
          out="$(mktemp -d)"
          cp -r scripts "$out/scripts"
          (cd "$out" && node scripts/heartbeat/generate.mjs)
          test -s "$out/heartbeats/public.svg" \
            || { echo "generator produced no output" >&2; exit 1; }
          python3 -c "import xml.etree.ElementTree as E,sys; E.parse(sys.argv[1])" \
            "$out/heartbeats/public.svg"
          rm -rf "$out"

      - name: Build Jekyll Site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5