name: Refresh Jekyll Snapshot

# Sync .md page files from frenzypenguin-media/ to frenzypenguin-media.github.io/
# This ensures the GitHub Pages mirror stays in sync with the source Jekyll site.
#
# Flow:
#   1. Check out frenzypenguin-media (source)
#   2. Copy .md pages (excluding social.md which is auto-generated)
#   3. Check out frenzypenguin-media.github.io (target)
#   4. Copy .md pages to _posts/ or root per each file's frontmatter permalink
#   5. Commit to frenzypenguin-media.github.io (GitHub Pages serves from main branch)
#
# GitHub Actions vars/secrets needed:
#   GH_PAGES_TOKEN — token with write access to frenzypenguin-media.github.io
#                     (not required if GITHUB_TOKEN covers both repos)

on:
  schedule:
    # Run every 5 minutes to keep snapshot in sync
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-pages:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout source ─────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: neohiro/frenzypenguin-media
          path: source
          token: ${{ secrets.GH_PAGES_TOKEN || github.token }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Verify source pages
        run: |
          if [ ! -d source/social.md ]; then
            echo "::error::social.md not found in source — expected auto-generated page"
            exit 1
          fi
          echo "Source pages:"
          find source -name "*.md" -not -path "*/.git/*" | sort

      # ── 2. Copy .md pages ──────────────────────────────────────────────────────
      - name: Copy .md pages to target
        run: |
          mkdir -p site-target
          # Copy all .md files except social.md (auto-generated by embed widget)
          cp -r source/!(social.md) site-target/
          # Also copy social.md — it will be regenerated on next deploy
          cp source/social.md site-target/
          echo "Target pages:"
          find site-target -name "*.md" -not -path "*/.git/*" | sort

      # ── 3. Checkout target ────────────────────────────────────────────────────
      - name: Checkout GitHub Pages site
        uses: actions/checkout@v4
        with:
          repository: frenzypenguin-media/frenzypenguin-media.github.io
          path: target-site
          token: ${{ secrets.GH_PAGES_TOKEN || github.token }}
          persist-credentials: false

      # ── 4. Copy .md pages to target ────────────────────────────────────────────
      - name: Copy .md pages to GitHub Pages
        run: |
          mkdir -p target-site
          # Remove old .md files first to handle deletions
          rm -rf target-site/*.md
          cp -r site-target/*.md target-site/
          # Also copy social.md explicitly (it's auto-generated but we keep a copy)
          cp site-target/social.md target-site/ 2>/dev/null || true
          echo "Deployed .md files:"
          find target-site -name "*.md" -not -path "*/.git/*" | sort

      # ── 5. Commit and push ────────────────────────────────────────────────────
      - name: Commit and push to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN || github.token }}
        run: |
          cd target-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.md .nojekyll
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git status --short
            git commit -m "sync(jekyll): refresh snapshot $(date -u +%Y-%m-%dT%H:%M:%S)"
            git push
            echo "::notice::Jekyll snapshot refreshed"
          fi