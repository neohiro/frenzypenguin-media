<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <!-- Matrix rain canvas for background ambience -->
  <canvas id="matrix-canvas" aria-hidden="true"></canvas>
  
  <!-- Glitch overlay for page transitions -->
  <div id="glitch-overlay" class="glitch-overlay" aria-hidden="true">
    <div class="glitch-text" data-text="FPM"></div>
  </div>

  <div class="page-wrapper">
    <header class="site-header" role="banner">
      <div class="container">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="FrenzyPenguin Media - Home">
          <span class="logo-mark" aria-hidden="true">🎬</span>
          <span class="logo-text">frenzypenguin.media</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="#featured-tools" class="nav-link">Tools</a>
          <a href="#hardening-guides" class="nav-link">Guides</a>
          <a href="{{ '/repositories/' | relative_url }}" class="nav-link">Repositories</a>
          <a href="{{ '/media/' | relative_url }}" class="nav-link">Media</a>
          <a href="https://github.com/sponsors/neohiro" class="nav-link nav-sponsor" target="_blank" rel="noopener">Sponsor</a>
        </nav>
      </div>
    </header>

    <main class="site-main" role="main">
      {{ content }}
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="container">
        <p class="footer-tagline">Made with <span class="heart" aria-hidden="true">♥</span> by FrenzyPenguin Media</p>
        <p class="footer-links">
          <a href="https://github.com/neohiro" target="_blank" rel="noopener">GitHub</a>
          <span aria-hidden="true">·</span>
          <a href="https://github.com/sponsors/neohiro" target="_blank" rel="noopener">Sponsor</a>
          <span aria-hidden="true">·</span>
          <a href="https://linktr.ee/frenzypenguin.media" target="_blank" rel="noopener">Links</a>
        </p>
        <div class="sponsor-links">
          <a href="https://neohiro.github.io/" target="_blank" rel="noopener">🌐 neohiro.github.io</a>
          <a href="https://transhumanists.github.io/" target="_blank" rel="noopener">🧬 transhumanists</a>
          <a href="https://github.com/sponsors/neohiro" class="sponsor-red" target="_blank" rel="noopener">♥ Sponsor neohiro</a>
        </div>
        <p class="footer-copyright">Part of <a href="https://github.com/neohiro" target="_blank" rel="noopener">neohiro</a> ecosystem</p>
      </div>
    </footer>
  </div>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
