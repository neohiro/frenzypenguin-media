<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/network-ux.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/auth-bar.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <!-- Matrix rain canvas for background ambience -->
  <canvas id="matrix-canvas" aria-hidden="true"></canvas>

  <!-- Glitch overlay for page transitions -->
  <div id="glitch-overlay" class="glitch-overlay" aria-hidden="true">
    <div class="glitch-text" data-text="NEOHIRO"></div>
  </div>

  <div class="page-wrapper">
    <header class="site-header" role="banner">
      <div class="container">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="neohiro - Home">
          <span class="logo-mark" aria-hidden="true">👽</span>
          <span class="logo-text">neohiro</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="#featured-tools" class="nav-link">Tools</a>
          <a href="#hardening-guides" class="nav-link">Guides</a>
          <a href="{{ '/repositories/' | relative_url }}" class="nav-link">Repositories</a>
          <a href="{{ '/media/' | relative_url }}" class="nav-link">Media</a>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn" aria-haspopup="true" aria-expanded="false">
              Community <span aria-hidden="true">▾</span>
            </button>
            <div class="nav-dropdown-menu">
              <a href="https://github.com/neohiro" class="nav-dropdown-item">Org Overview</a>
              <a href="https://github.com/neohiro/windows/issues" class="nav-dropdown-item">Bug Reports</a>
              <a href="https://github.com/neohiro/windows/security" class="nav-dropdown-item">Security Advisories</a>
              <a href="https://github.com/neohiro/windows/discussions" class="nav-dropdown-item">Discussions</a>
              <a href="https://github.com/sponsors/neohiro" class="nav-dropdown-item">Sponsor</a>
            </div>
          </div>
          <a href="https://github.com/sponsors/neohiro" class="nav-link nav-sponsor" target="_blank" rel="noopener">Sponsor</a>
        </nav>
      </div>
    </header>

    <main id="main" class="site-main" role="main" tabindex="-1">
      {{ content }}
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="container">
        <div align="center">
          <script type="text/javascript" src="https://www.freevisitorcounters.com/en/home/counter/1631174/t/1" defer></script>
        </div>
        {% include footer-button-row.html org="fpm" %}
      </div>
    </footer>
  </div>

  {% include auth-bar.html %}

  <!-- Scripts: load order matters. fpm-typing.js MUST load before main.js
       because main.js calls FpmTyping.startPoller and FpmTyping.autoAttach.
       Both are defer so DOMContentLoaded fires only after both are parsed. -->
  <script src="{{ '/assets/js/fpm-typing.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/network-ux.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/auth-bar.js' | relative_url }}" defer></script>
</body>
</html>
